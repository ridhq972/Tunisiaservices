<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Tunis Services</title>

<style>

/* =========================
   GENERAL
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:#f5f7fb;
    color:#172033;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}


/* =========================
   HEADER
========================= */

header{
    background:#111827;
    color:white;
    padding:15px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.nav{
    display:flex;
    gap:6px;
    align-items:center;
}

.nav button{
    border:0;
    background:transparent;
    color:white;
    padding:9px 11px;
    border-radius:7px;
}

.nav button:hover{
    background:#1f2937;
}

.login-btn{
    background:#2563eb !important;
}


/* =========================
   HERO
========================= */

.hero{
    background:linear-gradient(
        135deg,
        #2563eb,
        #4f46e5
    );

    color:white;
    text-align:center;
    padding:75px 20px;
}

.hero h1{
    font-size:38px;
    margin-bottom:15px;
}

.hero p{
    font-size:18px;
    margin-bottom:28px;
}

.hero button{
    border:0;
    background:white;
    color:#2563eb;
    padding:14px 26px;
    border-radius:9px;
    font-size:16px;
    font-weight:bold;
}


/* =========================
   CONTAINER
========================= */

.container{
    max-width:1100px;
    margin:40px auto;
    padding:0 20px;
}

.section-title{
    text-align:center;
    font-size:29px;
    margin-bottom:25px;
}


/* =========================
   SEARCH
========================= */

.search-box{
    margin-bottom:35px;
}

.search-box input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:10px;
    background:white;
    outline:none;
    font-size:15px;
}


/* =========================
   CATEGORY
========================= */

.category{
    margin-bottom:50px;
}

.category-title{
    background:#111827;
    color:white;
    padding:15px 20px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:21px;
}


/* =========================
   SERVICES
========================= */

.services{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));

    gap:18px;
}

.service{
    background:white;
    border-radius:15px;
    padding:23px;
    text-align:center;
    box-shadow:
        0 4px 18px rgba(0,0,0,.07);

    transition:.2s;
}

.service:hover{
    transform:translateY(-3px);
}

.icon{
    font-size:40px;
    margin-bottom:12px;
}

.service h3{
    font-size:18px;
    margin-bottom:10px;
}

.service p{
    color:#667085;
    line-height:1.6;
    margin-bottom:14px;
}

.price{
    color:#2563eb;
    font-weight:bold;
    margin-bottom:15px;
}

.service button{
    width:100%;
    background:#2563eb;
    color:white;
    border:0;
    padding:12px;
    border-radius:8px;
    font-size:15px;
}

.service button:hover{
    background:#1d4ed8;
}


/* =========================
   INFO
========================= */

.info-section{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);

    gap:18px;
    margin-top:55px;
}

.info-card{
    background:white;
    padding:25px;
    border-radius:14px;
    text-align:center;

    box-shadow:
        0 3px 15px rgba(0,0,0,.06);
}

.info-card .big{
    font-size:35px;
    margin-bottom:10px;
}

.info-card p{
    color:#667085;
    margin-top:8px;
}


/* =========================
   FOOTER
========================= */

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:30px 20px;
    margin-top:60px;
}

footer p{
    color:#cbd5e1;
    margin-top:8px;
}


/* =========================
   MODALS
========================= */

.modal{
    display:none;

    position:fixed;
    inset:0;

    background:
        rgba(0,0,0,.65);

    z-index:1000;

    padding:20px;

    overflow:auto;
}

.modal-box{
    background:white;

    max-width:520px;

    margin:35px auto;

    padding:25px;

    border-radius:16px;

    position:relative;
}

.close{
    position:absolute;

    left:15px;
    top:12px;

    border:0;

    background:#eee;

    width:35px;
    height:35px;

    border-radius:50%;

    font-size:20px;
}

.modal h2{
    margin-bottom:20px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;

    margin-bottom:7px;

    font-weight:bold;
}

.form-group input,
.form-group select{

    width:100%;

    padding:13px;

    border:1px solid #d1d5db;

    border-radius:8px;

    outline:none;

    background:white;
}


/* =========================
   PRICE
========================= */

.price-box{

    background:#eff6ff;

    padding:16px;

    border-radius:10px;

    margin:15px 0;

    text-align:center;
}

.price-box span{

    display:block;

    font-size:27px;

    font-weight:bold;

    color:#2563eb;

    margin-top:6px;
}


/* =========================
   PAYMENT
========================= */

.payment-section{

    margin-top:25px;

    border-top:1px solid #eee;

    padding-top:20px;
}

.payment-title{

    font-size:19px;

    margin-bottom:13px;
}

.payment-methods{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:10px;
}

.payment-option{

    background:#f8fafc;

    border:1px solid #dbe2ea;

    padding:14px 8px;

    border-radius:10px;

    color:#172033;

    font-size:14px;
}

.payment-option:hover{

    border-color:#2563eb;

    background:#eff6ff;
}

.payment-option.active{

    border:2px solid #2563eb;

    background:#eff6ff;
}

.payment-details{

    display:none;

    margin-top:15px;

    padding:15px;

    background:#f8fafc;

    border-radius:10px;
}

.payment-details h4{

    margin-bottom:12px;
}

.payment-details p{

    line-height:1.7;

    color:#475467;

}

.payment-details input{

    width:100%;

    padding:12px;

    margin-top:8px;

    border:1px solid #ddd;

    border-radius:8px;
}


/* =========================
   WALLET
========================= */

.wallet-address{

    background:#111827;

    color:white;

    padding:13px;

    border-radius:8px;

    margin:12px 0;

    font-size:12px;

    direction:ltr;

    text-align:left;

    word-break:break-all;
}

.copy-button{

    width:100%;

    padding:11px;

    border:0;

    background:#e5e7eb;

    border-radius:8px;
}


/* =========================
   WHATSAPP
========================= */

.whatsapp-box{

    margin-top:18px;

    padding:15px;

    background:#f0fdf4;

    border-radius:10px;

    text-align:center;
}

.whatsapp-box p{

    margin-bottom:12px;

    line-height:1.6;
}

.whatsapp-button{

    width:100%;

    padding:13px;

    border:0;

    border-radius:8px;

    background:#16a34a;

    color:white;

    font-weight:bold;

    font-size:15px;
}


/* =========================
   BUTTONS
========================= */

.primary{

    width:100%;

    background:#2563eb;

    color:white;

    border:0;

    padding:13px;

    border-radius:8px;

    font-size:16px;
}

.primary:hover{

    background:#1d4ed8;
}

.secondary{

    width:100%;

    background:#e5e7eb;

    border:0;

    padding:12px;

    border-radius:8px;

    margin-top:10px;
}


/* =========================
   MESSAGE
========================= */

.message{

    text-align:center;

    margin-top:15px;

    font-weight:bold;

    line-height:1.6;
}


/* =========================
   ORDERS
========================= */

.orders-panel{

    display:none;

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.65);

    z-index:1000;

    padding:20px;

    overflow:auto;
}

.orders-box{

    background:white;

    max-width:650px;

    margin:40px auto;

    padding:25px;

    border-radius:16px;

    position:relative;
}

.order{

    border:1px solid #e5e7eb;

    border-radius:10px;

    padding:15px;

    margin-top:10px;

    line-height:1.8;
}

.order strong{

    color:#2563eb;
}

.empty{

    text-align:center;

    color:#777;

    padding:25px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    header{

        padding:13px 12px;
    }

    .logo{

        font-size:16px;
    }

    .nav button{

        font-size:11px;

        padding:7px 6px;
    }

    .hero{

        padding:55px 18px;
    }

    .hero h1{

        font-size:29px;
    }

    .hero p{

        font-size:15px;
    }

    .services{

        grid-template-columns:
            1fr 1fr;

        gap:12px;
    }

    .service{

        padding:17px 12px;
    }

    .service h3{

        font-size:15px;
    }

    .service p{

        font-size:13px;
    }

    .icon{

        font-size:34px;
    }

    .info-section{

        grid-template-columns:1fr;
    }

}

@media(max-width:420px){

    .services{

        grid-template-columns:1fr;
    }

    .payment-methods{

        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

        </div>


        <div class="services">

            <div
