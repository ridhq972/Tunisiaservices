<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tunis Services</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:#f5f7fb;
    color:#172033;
}

header{
    background:linear-gradient(135deg,#111827,#2563eb);
    color:white;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 15px #0002;
}

.nav{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#60a5fa;
}

.nav-buttons{
    display:flex;
    gap:8px;
}

.nav-buttons button{
    border:0;
    padding:10px 14px;
    border-radius:10px;
    background:#ffffff18;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.hero{
    max-width:1200px;
    margin:25px auto;
    padding:55px 25px;
    border-radius:25px;
    color:white;
    text-align:center;
    background:linear-gradient(135deg,#1d4ed8,#7c3aed);
    box-shadow:0 10px 30px #0002;
}

.hero h1{
    font-size:38px;
    margin-bottom:15px;
}

.hero p{
    font-size:18px;
    opacity:.95;
}

.search-box{
    max-width:700px;
    margin:25px auto;
    padding:0 15px;
}

.search-box input{
    width:100%;
    padding:16px 20px;
    border:1px solid #ddd;
    border-radius:15px;
    font-size:16px;
    outline:none;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:10px 15px 50px;
}

.category{
    margin-top:35px;
}

.category-title{
    font-size:25px;
    margin-bottom:18px;
    border-right:5px solid #2563eb;
    padding-right:12px;
}

.services{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:18px;
}

.service{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:0 5px 20px #0000000d;
    border:1px solid #e8ebf2;
    transition:.2s;
}

.service:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 25px #0002;
}

.icon{
    font-size:40px;
    margin-bottom:10px;
}

.service h3{
    margin-bottom:8px;
    font-size:19px;
}

.service p{
    color:#687386;
    min-height:42px;
    line-height:1.5;
}

.price{
    font-weight:bold;
    color:#2563eb;
    margin:15px 0;
    font-size:18px;
}

.service button,
.primary-btn{
    width:100%;
    border:0;
    border-radius:11px;
    padding:13px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
}

.service button:hover,
.primary-btn:hover{
    background:#1d4ed8;
}

.secondary-btn{
    width:100%;
    border:0;
    border-radius:11px;
    padding:13px;
    background:#e5e7eb;
    color:#111827;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#0008;
    z-index:2000;
    padding:15px;
    overflow:auto;
}

.modal-box{
    background:white;
    max-width:560px;
    margin:30px auto;
    border-radius:20px;
    padding:22px;
    position:relative;
}
