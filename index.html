*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{

    color:#172033;
}

button,input{
    font-family:inherit;

button{
    cursor:pointer;

header{

    z-index:100;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.nav{
    display:flex;
    gap:8px;
    align-items:center;
}

.nav button{
    background:transparent;
    border:0;
    color:white;
    padding:9px 12px;
    border-radius:7px;
}

.login-btn{

}

.hero h1{
    font-size:38px;
    margin-bottom:15px;
}

.hero p{
    font-size:18px;

}

.hero-btn{

    color:#2563eb;
    padding:14px 25px;
    border-radius:9px;
    font-size:16px;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:40px auto;
    padding:0 20px;
}

.section-title{
    text-align:center;
    font-size:28px;
    margin-bottom:25px;
}

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:25px;
}

.search-box input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    background:white;
    outline:none;
}

.services{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:18px;
}
